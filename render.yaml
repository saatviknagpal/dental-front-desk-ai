services:
  - type: web
    name: bright-smile-dental-chatbot
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: LLM_PROVIDER
        value: openai
      - key: LLM_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: STAFF_PASSWORD
        sync: false
      - key: STAFF_PASSWORDS
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: ALLOW_DEMO_RESET
        value: "true"
